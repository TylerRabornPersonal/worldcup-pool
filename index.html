<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2026 World Cup Pool — Make Your Picks</title>
<style>
  :root{
    --purple:#37003c; --pink:#e90052; --green:#00ff87; --cyan:#02efff;
    --ink:#37003c; --mut:#6f6f86; --line:#ece9f2; --bg:#f7f7fb; --card:#ffffff;
    --ok:#00c46a; --bad:#e90052; --grad:linear-gradient(90deg,var(--cyan),var(--green));
    --shadow:0 6px 22px rgba(55,0,60,.08);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
  .topbar{background:linear-gradient(120deg,var(--purple),#5a0f63);color:#fff;padding:0}
  .topbar .inner{max-width:1040px;margin:0 auto;padding:22px 22px 26px;position:relative}
  .topbar .grad{height:5px;background:var(--grad)}
  h1{margin:0;font-size:1.7rem;letter-spacing:-.02em;font-weight:800}
  .sub{color:#e7d9ec;font-size:.95rem;margin-top:4px}
  .navlink{display:inline-block;margin-top:14px;background:rgba(255,255,255,.14);color:#fff;
    text-decoration:none;font-weight:700;font-size:.85rem;padding:8px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.2)}
  .navlink:hover{background:rgba(255,255,255,.24)}
  .wrap{max-width:1040px;margin:0 auto;padding:18px 22px 130px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:20px;margin:16px 0}
  .card h2{margin:0 0 4px;font-size:1.05rem}
  .rules{color:var(--mut);font-size:.92rem}.rules b{color:var(--ink)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:560px){.grid2{grid-template-columns:1fr}}
  label.f{display:block;font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);margin:0 0 6px}
  input[type=text],input[type=email]{width:100%;padding:12px 14px;border-radius:11px;border:1.5px solid var(--line);
    background:#fff;color:var(--ink);font-size:1rem;transition:border-color .15s}
  input:focus{outline:none;border-color:var(--cyan)}
  .groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:14px}
  .grp{background:#fff;border:1px solid var(--line);border-radius:15px;overflow:hidden;box-shadow:var(--shadow)}
  .grp .gh{background:linear-gradient(120deg,var(--purple),#6a1773);color:#fff;padding:9px 14px;font-weight:800;font-size:.9rem;
    display:flex;align-items:center;gap:8px}
  .grp .gh .dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
  .grp .body{padding:8px}
  .team{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:11px;cursor:pointer;transition:background .12s;position:relative}
  .team:hover{background:#f4f1f9}
  .chk{width:22px;height:22px;border-radius:7px;border:2px solid #d6d0e2;display:flex;align-items:center;justify-content:center;
    flex:0 0 auto;transition:.12s;background:#fff}
  .chk svg{width:13px;height:13px;opacity:0;transform:scale(.5);transition:.12s}
  .team .nm{flex:1;font-weight:600}
  .seed{font-variant-numeric:tabular-nums;color:var(--purple);font-size:.78rem;font-weight:800;
    background:#f0ecf6;padding:3px 9px;border-radius:999px}
  .team.sel{background:linear-gradient(120deg,#f0fff8,#eafff4)}
  .team.sel .chk{background:var(--green);border-color:var(--green)}
  .team.sel .chk svg{opacity:1;transform:scale(1)}
  .team.sel .seed{background:var(--purple);color:#fff}
  .team.dis{opacity:.38;cursor:not-allowed}
  .team.dis:hover{background:none}
  /* sticky action bar */
  .bar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);
    border-top:1px solid var(--line);box-shadow:0 -6px 24px rgba(55,0,60,.08);padding:12px 16px}
  .bar .inner{max-width:1040px;margin:0 auto;display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap}
  .pill{display:flex;align-items:center;gap:8px;background:#f4f1f9;border-radius:999px;padding:8px 16px;font-size:.9rem;font-weight:600}
  .pill b{font-size:1.15rem;font-variant-numeric:tabular-nums}
  .pill.good{background:#e8fff4;color:var(--ok)} .pill.bad{background:#ffe9f1;color:var(--bad)}
  button#submit{background:var(--grad);color:var(--purple);border:0;border-radius:999px;padding:13px 26px;font-size:1rem;
    font-weight:800;cursor:pointer;box-shadow:0 4px 14px rgba(0,255,135,.35);transition:.15s}
  button#submit:hover:not(:disabled){transform:translateY(-1px)}
  button#submit:disabled{background:#e7e3ee;color:#a59fb3;box-shadow:none;cursor:not-allowed}
  .err{color:var(--bad);font-size:.85rem;text-align:center;width:100%;min-height:1em;font-weight:600;margin-top:2px}
  .load{padding:44px;text-align:center;color:var(--mut)}
  code{background:#f0ecf6;padding:2px 6px;border-radius:6px;font-size:.85em}
  /* scoring explainer */
  .scorebox{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 16px}
  .scorebox .s{flex:1;min-width:150px;background:#f7f5fb;border-radius:12px;padding:12px 14px}
  .scorebox .s .big{font-size:1.25rem;font-weight:800;color:var(--purple)}
  table.mult{width:100%;border-collapse:collapse;font-size:.86rem;margin:6px 0}
  table.mult th,table.mult td{padding:8px 6px;text-align:center;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
  table.mult th{background:var(--purple);color:#fff;font-size:.72rem;text-transform:uppercase;letter-spacing:.03em;border:0}
  table.mult th:first-child,table.mult td:first-child{text-align:left}
  table.mult thead th:first-child{border-top-left-radius:10px}
  table.mult thead th:last-child{border-top-right-radius:10px}
  table.mult td.seed{font-weight:800;color:var(--purple)}
  table.mult tr td{border-left:4px solid transparent}
  .ex{background:linear-gradient(120deg,#f0fff8,#eafff4);border-radius:12px;padding:12px 14px;margin-top:14px;color:var(--ink)}
  .ex .lbl{font-size:.74rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--ok);margin-bottom:4px}
  table.mult tr.bonusrow td{color:var(--ok);filter:brightness(.85)}
  table.mult tr.bonusrow td b{color:var(--ok);filter:brightness(.8)}
  table.mult tr.norow td{color:var(--mut)}
  /* always-visible rules section */
  .rulesfull{padding:22px}
  .rulesfull .rh{margin:0 0 6px;font-size:1.25rem;color:var(--purple)}
  .rulesfull .lead{margin:0 0 14px;color:var(--mut);font-size:.95rem}
  .rulesfull .lead b{color:var(--ink)}
  .formula{display:flex;flex-wrap:wrap;align-items:center;gap:4px;justify-content:center;text-align:center;
    background:#f7f5fb;border:1px solid var(--line);border-radius:12px;padding:12px;font-weight:700;color:var(--mut);margin-bottom:16px}
  .formula .fa{color:var(--purple)} .formula .fb{color:#7a3fb0} .formula .fc{color:var(--ok);filter:brightness(.85)}
  .steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
  .step{background:#fbfaff;border:1px solid var(--line);border-radius:14px;padding:14px}
  .step.hot{background:linear-gradient(160deg,#f0fff8,#eafff4);border-color:#9fe9c4}
  .step .sh{display:flex;align-items:center;gap:9px;font-weight:800;font-size:1rem;margin-bottom:4px}
  .step .num{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;
    background:var(--purple);color:#fff;font-size:.85rem;flex:0 0 auto}
  .step.hot .num{background:var(--ok);filter:brightness(.85)}
  .step .tag{margin-left:auto;font-size:.66rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;
    background:var(--ok);filter:brightness(.95);color:#06351f;padding:3px 8px;border-radius:999px}
  .step .sd{margin:.25rem 0 10px;font-size:.86rem;color:var(--mut);line-height:1.45}
  .step .sd b,.step .sd i{color:var(--ink)}
  .step table.mult{margin:0}
  .valuetip{margin:16px 0 0;background:#fffaf0;border:1px solid #ffe0a8;border-radius:14px;padding:14px 16px;font-size:.92rem;color:#5c4a1f}
  .valuetip .vt-h{font-weight:800;color:#b9770a;margin-bottom:4px}
  .valuetip b{color:#3d3112}
  .rulesfull .fine{margin:14px 0 0;font-size:.8rem;color:var(--mut);line-height:1.6}
</style>
</head>
<body>
<div class="topbar">
  <div class="inner">
    <h1>⚽ 2026 World Cup Pool</h1>
    <div class="sub" id="sub">Pick your teams</div>
    <a class="navlink" href="standings.html">View live standings →</a>
  </div>
  <div class="grad"></div>
</div>

<div class="wrap">
  <section class="card rulesfull">
    <div id="rulesContent" class="load">Loading rules…</div>
  </section>

  <div class="card">
    <h2>Your details</h2>
    <div class="grid2" style="margin-top:12px">
      <div><label class="f">Name</label><input type="text" id="player" placeholder="First and last name" autocomplete="name"></div>
      <div><label class="f">Email</label><input type="email" id="email" placeholder="you@email.com" autocomplete="email"></div>
    </div>
  </div>

  <div class="card">
    <h2>Choose your squad</h2>
    <div id="board" class="load">Loading teams…</div>
  </div>
</div>

<div class="bar">
  <div class="inner">
    <div class="pill bad" id="cntPill">Teams <b id="cnt">0</b> / <span id="need">6</span></div>
    <div class="pill bad" id="sumPill">Combined rank <b id="sum">0</b> <span style="font-weight:500;opacity:.8">/ need ≥<span id="floor">72</span></span></div>
    <button id="submit" disabled>Submit picks</button>
    <div class="err" id="err"></div>
  </div>
</div>

<script src="scoring.js"></script>
<script>
const CHK='<svg viewBox="0 0 24 24" fill="none" stroke="#37003c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
let CONF=null, TEAMS=[], BYNAME={}, picked=new Set();

fetch('data/teams.json').then(r=>r.json()).then(d=>{
  CONF=d.config; TEAMS=d.teams; TEAMS.forEach(t=>BYNAME[t.name]=t);
  document.getElementById('need').textContent=CONF.picksRequired;
  document.getElementById('floor').textContent=CONF.combinedRankMin;
  document.getElementById('sub').textContent=`Pick exactly ${CONF.picksRequired} teams whose combined rank is ${CONF.combinedRankMin}+`;
  buildHow();
  render();
}).catch(()=>{document.getElementById('board').innerHTML=
  '⚠️ Could not load team data. If you opened this file directly, run a local server (<code>python3 -m http.server</code>) or use the published site.';});

function buildHow(){
  const base=CONF.baseValues, sm=CONF.seedMultByTier, ob=CONF.ownershipBonus;
  const ranges={};
  TEAMS.forEach(t=>{ if(!ranges[t.tier]) ranges[t.tier]={min:t.rank,max:t.rank};
    ranges[t.tier].min=Math.min(ranges[t.tier].min,t.rank); ranges[t.tier].max=Math.max(ranges[t.tier].max,t.rank); });
  const keys=Object.keys(sm).map(Number).sort((a,b)=>a-b);
  const ramp=['#d9d3e8','#cfe0f5','#bfe6d6','#9fe9c4','#6fe9ab','#00d97a'];
  const tierRows=keys.map((k,i)=>{const r=ranges[k]||{min:'',max:''};
    return `<tr style="border-left-color:${ramp[Math.min(i,ramp.length-1)]}"><td class="seed">#${r.min}–${r.max}</td><td><b>${sm[k]}×</b></td></tr>`;}).join('');
  const obRows=ob.map((t,i)=>{const prev=i?ob[i-1].maxPct:0;
    const label=t.maxPct>=100?`more than ${prev}%`:(i===0?`${t.maxPct}% or fewer`:`${prev+1}–${t.maxPct}%`);
    const hot=t.mult>1?'class="bonusrow"':'class="norow"';
    return `<tr ${hot}><td>${label}</td><td><b>×${t.mult.toFixed(2).replace(/\.?0+$/,'')}</b></td></tr>`;}).join('');

  // worked example: a real mid-seed value team
  const ex=TEAMS.find(t=>t.name==='Norway')||TEAMS[27];
  const exBase=2*base.gw*ex.seedMult + base.r32*ex.seedMult; // 2 group wins + win R32
  const hi=ob[0].mult, hiPct=ob[0].maxPct;

  document.getElementById('rulesContent').className='';
  document.getElementById('rulesContent').innerHTML=
   `<h2 class="rh">How the game works</h2>
    <p class="lead">Pick <b>${CONF.picksRequired} teams</b> whose seeds (1–48) add up to <b>${CONF.combinedRankMin} or more</b> — so you can't just grab the favorites. Your teams score all tournament long; highest total wins. Entry $${CONF.entryFee}.</p>
    <div class="formula">A team's points&nbsp; = &nbsp;<span class="fa">what it wins</span>&nbsp;×&nbsp;<span class="fb">seed multiplier</span>&nbsp;×&nbsp;<span class="fc">ownership bonus</span></div>

    <div class="steps">
      <div class="step">
        <div class="sh"><span class="num">1</span> What it wins</div>
        <p class="sd">Every game your team wins earns a base value. The deeper the round, the bigger it is.</p>
        <table class="mult"><thead><tr><th>Grp W</th><th>Grp tie</th><th>R32</th><th>R16</th><th>QF</th><th>SF</th><th>Final</th></tr></thead>
          <tbody><tr><td>${base.gw}</td><td>${base.gt}</td><td>${base.r32}</td><td>${base.r16}</td><td>${base.qf}</td><td>${base.sf}</td><td>${base.final}</td></tr></tbody></table>
      </div>

      <div class="step">
        <div class="sh"><span class="num">2</span> Seed multiplier</div>
        <p class="sd">Lower-seeded teams multiply <i>everything</i> they earn. The underdogs are worth more.</p>
        <table class="mult"><thead><tr><th>Seed</th><th>×</th></tr></thead><tbody>${tierRows}</tbody></table>
      </div>

      <div class="step hot">
        <div class="sh"><span class="num">3</span> Ownership bonus <span class="tag">the twist</span></div>
        <p class="sd">Locked when picks close. The <b>fewer entrants</b> who pick a team, the bigger the bonus on its <b>whole</b> total. Popular picks (40%+) get nothing.</p>
        <table class="mult"><thead><tr><th>% who pick it</th><th>×</th></tr></thead><tbody>${obRows}</tbody></table>
      </div>
    </div>

    <div class="valuetip">
      <div class="vt-h">💡 Where the value is</div>
      Two ways to multiply a result, and they stack. A <b>low seed</b> nobody else thinks of can turn a single win into a huge score — while a favorite that everyone picks earns its base value and no ownership bonus at all. The winning move isn't "pick the best teams," it's <b>find good teams other people will overlook.</b>
    </div>

    <div class="ex">
      <div class="lbl">Example — stacking both multipliers</div>
      <b>${ex.name}</b> (seed #${ex.rank}, ${ex.seedMult}× tier) wins 2 group games and its Round of 32 match:
      (2 × ${base.gw} + ${base.r32}) × ${ex.seedMult} = <b>${Math.round(exBase*100)/100} pts</b>.
      If only ${hiPct}% or fewer also pick ${ex.name}, the ×${hi} ownership bonus makes that <b>${Math.round(exBase*hi*100)/100} pts</b>.
    </div>

    <p class="fine"><b>Good to know:</b> a group tie = half a win · a knockout win on penalties counts as a full win (the loser gets nothing) · the 3rd-place playoff is not scored · ties in the standings split the prize slots. Seeds are locked from the ${CONF.rankingSet}.</p>`;
}

function render(){
  const groups={}; TEAMS.forEach(t=>{(groups[t.group]=groups[t.group]||[]).push(t)});
  const board=document.getElementById('board'); board.className=''; board.innerHTML='';
  const grid=document.createElement('div'); grid.className='groups';
  Object.keys(groups).sort().forEach(g=>{
    const box=document.createElement('div'); box.className='grp';
    box.innerHTML=`<div class="gh"><span class="dot"></span>Group ${g}</div>`;
    const body=document.createElement('div'); body.className='body';
    groups[g].sort((a,b)=>a.rank-b.rank).forEach(t=>{
      const row=document.createElement('div'); row.className='team'; row.dataset.name=t.name;
      row.innerHTML=`<div class="chk">${CHK}</div><span class="nm">${t.name}</span><span class="seed">#${t.rank}</span>`;
      row.addEventListener('click',()=>{ if(row.classList.contains('dis'))return; toggle(t.name); });
      body.appendChild(row);
    });
    box.appendChild(body); grid.appendChild(box);
  });
  board.appendChild(grid); update();
}
function toggle(name){ picked.has(name)?picked.delete(name):picked.add(name); update(); }
function update(){
  const need=CONF.picksRequired;
  document.querySelectorAll('.team').forEach(row=>{
    const n=row.dataset.name, sel=picked.has(n);
    row.classList.toggle('sel',sel);
    row.classList.toggle('dis', !sel && picked.size>=need);
  });
  const v=validatePicks([...picked],BYNAME,CONF);
  const cnt=document.getElementById('cnt'), sum=document.getElementById('sum');
  cnt.textContent=picked.size; sum.textContent=v.combined;
  document.getElementById('cntPill').className='pill '+(picked.size===need?'good':'bad');
  document.getElementById('sumPill').className='pill '+(v.combined>=CONF.combinedRankMin&&picked.size===need?'good':'bad');
  const nameOk=document.getElementById('player').value.trim() && document.getElementById('email').value.trim();
  document.getElementById('submit').disabled=!(v.ok && nameOk);
  document.getElementById('err').textContent = picked.size? (v.errors[0]||(nameOk?'':'Add your name and email above.')) : '';
}
['player','email'].forEach(id=>document.getElementById(id).addEventListener('input',update));

document.getElementById('submit').addEventListener('click',()=>{
  const player=document.getElementById('player').value.trim();
  const email=document.getElementById('email').value.trim();
  const list=[...picked].map(n=>({n,r:BYNAME[n].rank})).sort((a,b)=>a.r-b.r);
  const combined=list.reduce((s,x)=>s+x.r,0);
  const lines=list.map(x=>`  - ${x.n} (#${x.r})`).join('\n');
  const body=`Player: ${player}\nEmail: ${email}\n\nPicks (${list.length} teams, combined rank ${combined}):\n${lines}\n\n— sent from the 2026 World Cup Pool pick form`;
  window.location.href=`mailto:${encodeURIComponent(CONF.submitEmail||'')}?subject=${encodeURIComponent('World Cup Pool entry — '+player)}&body=${encodeURIComponent(body)}`;
  document.getElementById('err').textContent='Opening your email app — just hit send to submit. Then send your $10 entry fee.';
});
</script>
</body>
</html>
