<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2026 World Cup Pool — Live Standings</title>
<style>
  :root{
    --purple:#37003c; --pink:#e90052; --green:#00ff87; --cyan:#02efff;
    --ink:#37003c; --mut:#6f6f86; --line:#ece9f2; --bg:#f7f7fb; --card:#ffffff;
    --grad:linear-gradient(90deg,var(--cyan),var(--green));
    --shadow:0 6px 22px rgba(55,0,60,.08);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
  .topbar{background:linear-gradient(120deg,var(--purple),#5a0f63);color:#fff}
  .topbar .inner{max-width:1040px;margin:0 auto;padding:22px 22px 26px}
  .topbar .grad{height:5px;background:var(--grad)}
  h1{margin:0;font-size:1.6rem;font-weight:800;letter-spacing:-.02em}
  .sub{color:#e7d9ec;font-size:.92rem;margin-top:4px}
  .navlink{display:inline-block;margin-top:14px;background:rgba(255,255,255,.14);color:#fff;text-decoration:none;
    font-weight:700;font-size:.85rem;padding:8px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.2)}
  .navlink:hover{background:rgba(255,255,255,.24)}
  .wrap{max-width:1040px;margin:0 auto;padding:18px 22px 70px}
  /* hero stat tiles */
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}
  @media(max-width:620px){.tiles{grid-template-columns:repeat(2,1fr)}}
  .tile{border-radius:16px;padding:16px;color:#fff;box-shadow:var(--shadow)}
  .tile .v{font-size:1.7rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
  .tile .k{font-size:.78rem;opacity:.92;margin-top:6px;font-weight:600}
  .t1{background:linear-gradient(135deg,#02efff,#00ff87);color:var(--purple)}
  .t2{background:linear-gradient(135deg,#37003c,#6a1773)}
  .t3{background:linear-gradient(135deg,#e90052,#ff5c8a)}
  .t4{background:linear-gradient(135deg,#3d1d72,#6d4bd6)}
  /* leaderboard */
  .row{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:12px 0;overflow:hidden;box-shadow:var(--shadow)}
  .head{display:flex;align-items:center;gap:14px;padding:15px 16px;cursor:pointer}
  .place{width:40px;height:40px;flex:0 0 auto;border-radius:12px;display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:1.15rem;background:#f0ecf6;color:var(--purple)}
  .row.p1 .place{background:linear-gradient(135deg,#ffd700,#ffb300);color:#5a3b00}
  .row.p2 .place{background:linear-gradient(135deg,#d8d8e0,#b9b9c6);color:#3a3a45}
  .row.p3 .place{background:linear-gradient(135deg,#e6a673,#c97f43);color:#3d2200}
  .who{flex:1;min-width:0}
  .who .nm{font-weight:800;font-size:1.05rem}
  .who .meta{color:var(--mut);font-size:.84rem}
  .who .pz{color:var(--green);filter:brightness(.8);font-weight:700}
  .tot{background:var(--purple);color:#fff;border-radius:12px;padding:8px 14px;text-align:center;flex:0 0 auto}
  .tot b{font-size:1.35rem;font-variant-numeric:tabular-nums;display:block;line-height:1}
  .tot small{font-size:.62rem;opacity:.8;text-transform:uppercase;letter-spacing:.05em}
  .caret{color:var(--mut);flex:0 0 auto;transition:transform .15s}
  .row.open .caret{transform:rotate(180deg)}
  .detail{display:none;padding:0 16px 16px}
  .row.open .detail{display:block}
  table{width:100%;border-collapse:collapse;font-size:.88rem}
  th,td{text-align:right;padding:8px;border-top:1px solid var(--line)}
  th:first-child,td:first-child{text-align:left}
  th{color:var(--mut);font-weight:700;font-size:.72rem;text-transform:uppercase;letter-spacing:.03em}
  td.t{font-variant-numeric:tabular-nums}
  td .seed{color:var(--mut);font-size:.78rem;font-weight:700}
  tr.trow td b{color:var(--purple)}
  .bonus{background:#e8fff4;color:var(--ok);filter:brightness(.85);font-weight:800;padding:1px 7px;border-radius:999px;font-size:.8rem}
  .load{padding:50px;text-align:center;color:var(--mut)}
  .meta-foot{text-align:center;color:var(--mut);font-size:.82rem;margin-top:14px}
  .paystrip{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);
    padding:11px 14px;margin:0 0 12px;font-size:.9rem;color:var(--purple);text-align:center}
  .paystrip .ps-note{color:var(--mut);font-weight:400;font-size:.82rem}
  code{background:#f0ecf6;padding:2px 6px;border-radius:6px}
</style>
</head>
<body>
<div class="topbar">
  <div class="inner">
    <h1>🏆 2026 World Cup Pool</h1>
    <div class="sub" id="sub">Live standings</div>
    <a class="navlink" href="index.html">← Make your picks</a>
  </div>
  <div class="grad"></div>
</div>

<div class="wrap">
  <div class="tiles" id="tiles"></div>
  <div class="paystrip" id="paystrip"></div>
  <div id="board" class="load">Loading standings…</div>
  <div class="meta-foot" id="meta"></div>
</div>

<script src="scoring.js"></script>
<script>
const CARET='<svg class="caret" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>';
Promise.all([
  fetch('data/teams.json').then(r=>r.json()),
  fetch('data/picks.json').then(r=>r.json()),
  fetch('data/results.json').then(r=>r.json())
]).then(([td,pd,rd])=>{
  const CONF=td.config, TEAMS=td.teams;
  const entries=(pd.entries||[]).filter(e=>!/^EXAMPLE/i.test(e.player||''));
  const results=rd.teams||{};
  document.getElementById('sub').textContent=CONF.season+' • seeds from '+CONF.rankingSet;

  const rows=computeStandings(entries,TEAMS,results,CONF);
  const fee=CONF.entryFee, n=rows.length, pool=n*fee;
  // 3rd + last place refunded their entry; 1st/2nd split 75/25 of what's left
  const remaining=Math.max(0, pool - (n>2?fee:0) - (n>3?fee:0));
  const slots=new Array(Math.max(n,1)).fill(0);
  slots[0]=remaining*0.75; if(n>1) slots[1]=remaining*0.25;
  if(n>2) slots[2]=fee; if(n>3) slots[n-1]=fee;   // 3rd and last get money back
  const prizes=computePrizes(rows,pool,slots);
  const leader=rows[0]?rows[0].player:'—';
  const payChips=`1st $${(slots[0]||0).toFixed(0)} · 2nd $${(slots[1]||0).toFixed(0)}`+
    (n>2?` · 3rd $${fee}`:'')+(n>3?` · last $${fee}`:'');

  document.getElementById('tiles').innerHTML=
    `<div class="tile t1"><div class="v">$${pool}</div><div class="k">Prize pool</div></div>
     <div class="tile t2"><div class="v">${entries.length}</div><div class="k">Entries</div></div>
     <div class="tile t3"><div class="v">${rows[0]?rows[0].total.toFixed(1):'0'}</div><div class="k">Top score</div></div>
     <div class="tile t4"><div class="v" style="font-size:1.15rem">${leader}</div><div class="k">Current leader</div></div>`;
  document.getElementById('paystrip').innerHTML=
    `<b>Payouts</b> &nbsp;${payChips} &nbsp;<span class="ps-note">(3rd &amp; last get their $${fee} back; 1st/2nd split the rest 75/25)</span>`;

  const board=document.getElementById('board'); board.className=''; board.innerHTML='';
  if(!rows.length){board.innerHTML='<div class="load">No entries yet — they appear here once picks are submitted.</div>';}
  rows.forEach(r=>{
    const div=document.createElement('div'); div.className='row'+(r.place<=3?(' p'+r.place):'');
    const pz=prizes[r.player]?` · <span class="pz">$${prizes[r.player].toFixed(2)}</span>`:'';
    const teamRows=r.teams.map(t=>{const b=t.breakdown||{};
      const bz=t.bonus>1?`<span class="bonus">×${t.bonus}</span>`:`×${t.bonus}`;
      return `<tr class="trow"><td>${t.team} <span class="seed">#${t.rank}</span></td>
        <td class="t">${b.group||0}</td><td class="t">${b.r32||0}</td><td class="t">${b.r16||0}</td>
        <td class="t">${b.qf||0}</td><td class="t">${b.sf||0}</td><td class="t">${b.final||0}</td>
        <td class="t">${t.ownedPct}%</td><td class="t">${bz}</td>
        <td class="t"><b>${t.points}</b></td></tr>`;}).join('');
    div.innerHTML=
      `<div class="head"><div class="place">${r.place}</div>
        <div class="who"><div class="nm">${r.player}</div><div class="meta">${r.teams.length} teams${pz}</div></div>
        <div class="tot"><b>${r.total.toFixed(1)}</b><small>pts</small></div>${CARET}</div>
       <div class="detail"><table>
        <tr><th>Team</th><th>Grp</th><th>R32</th><th>R16</th><th>QF</th><th>SF</th><th>Fin</th><th>Own</th><th>Bonus</th><th>Pts</th></tr>
        ${teamRows}</table></div>`;
    div.querySelector('.head').addEventListener('click',()=>div.classList.toggle('open'));
    board.appendChild(div);
  });
  document.getElementById('meta').innerHTML='Results last updated: '+(rd.lastUpdated||'—')+' · tap any row for team-by-team points · <b>Own</b> = % of entrants who picked that team, <b>Bonus</b> = ownership reward (≤10% owned ×2, ≤25% ×1.5, ≤50% ×1.25)';
}).catch(()=>{document.getElementById('board').innerHTML=
  '<div class="load">⚠️ Could not load data. View on the published site, or run a local server (<code>python3 -m http.server</code>).</div>';});
</script>
</body>
</html>
